<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080">
    <title>{{CLIENT_NAME}} -- {{VARIANT_NAME}} (Story 9:16)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="{{FONT_IMPORT}}" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1080px;
            height: 1920px;
            overflow: hidden;
            background: {{BG_COLOR}};
            font-family: {{FONT_FAMILY}};
            -webkit-font-smoothing: antialiased;
        }

        .canvas {
            position: relative;
            width: 1080px;
            height: 1920px;
            overflow: hidden;
        }

        /* Image layer -- fills entire canvas */
        .image-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .image-layer img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .image-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: color-mix(in srgb, {{ACCENT_COLOR}} 15%, {{BG_COLOR}});
            border: 2px dashed color-mix(in srgb, {{ACCENT_COLOR}} 30%, transparent);
        }

        .image-placeholder span {
            font-size: 28px;
            font-weight: 500;
            color: color-mix(in srgb, {{TEXT_COLOR}} 50%, transparent);
            text-align: center;
            max-width: 600px;
            line-height: 1.4;
            padding: 40px;
        }

        /* Content overlay -- positioned within safe zones */
        /* Safe zones: top 270px, bottom 380px, sides 55px */
        .content-overlay {
            position: absolute;
            top: 270px;
            left: 55px;
            right: 55px;
            bottom: 380px;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            text-align: center;
        }

        /* Gradient backdrop for text readability over images */
        .content-backdrop {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.45) 0%, rgba(0, 0, 0, 0.15) 70%, transparent 100%);
            z-index: 1;
            pointer-events: none;
        }

        /* Only show backdrop when there's a real image */
        .has-image .content-backdrop {
            display: block;
        }

        .no-image .content-backdrop {
            display: none;
        }

        .headline {
            font-size: 80px;
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 28px;
            letter-spacing: -0.02em;
            max-width: 900px;
        }

        .has-image .headline {
            color: #FFFFFF;
            text-shadow: 0 3px 12px rgba(0, 0, 0, 0.4);
        }

        .no-image .headline {
            color: {{TEXT_COLOR}};
        }

        .body-copy {
            font-size: 38px;
            font-weight: 400;
            line-height: 1.4;
            margin-bottom: 40px;
            max-width: 800px;
        }

        .has-image .body-copy {
            color: rgba(255, 255, 255, 0.9);
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        }

        .no-image .body-copy {
            color: {{TEXT_COLOR_SECONDARY}};
        }

        .cta-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 24px 56px;
            background: {{ACCENT_COLOR}};
            color: #FFFFFF;
            font-family: {{FONT_FAMILY}};
            font-size: 34px;
            font-weight: 600;
            border: none;
            border-radius: {{BORDER_RADIUS}};
            letter-spacing: 0.02em;
            cursor: pointer;
        }

        /* Brand watermark -- positioned in usable zone */
        .brand-mark {
            position: absolute;
            top: 300px;
            left: 0;
            right: 0;
            z-index: 3;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            text-align: center;
        }

        .has-image .brand-mark {
            color: rgba(255, 255, 255, 0.6);
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
        }

        .no-image .brand-mark {
            color: color-mix(in srgb, {{TEXT_COLOR}} 40%, transparent);
        }
    </style>
</head>
<body>
    <div class="canvas {{IMAGE_MODE}}">
        <!-- Image Layer -->
        <div class="image-layer">
            {{IMAGE_HTML}}
        </div>

        <!-- Gradient backdrop for text readability -->
        <div class="content-backdrop"></div>

        <!-- Brand watermark -->
        <div class="brand-mark">{{CLIENT_NAME}}</div>

        <!-- Content -- positioned within safe zones -->
        <div class="content-overlay">
            <h1 class="headline">{{HEADLINE}}</h1>
            <p class="body-copy">{{BODY_COPY}}</p>
            <div class="cta-button">{{CTA_TEXT}}</div>
        </div>
    </div>
</body>
</html>
