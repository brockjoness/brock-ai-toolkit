<!--
  BASE STYLES — Pre-Onboarding Deliverables
  Extracted from the proposal template. Shared by all pre-onboarding HTML deliverables.
  Agency-specific values (--accent, fonts) are injected at generation time via {{PLACEHOLDER}} substitution.
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@1,600;1,700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
    :root {
        /* Base colors (shared across all agencies) */
        --bg-deep: #08080D;
        --bg-card: #111118;
        --bg-elevated: #1A1A24;
        --text-primary: #F0EFF4;
        --text-muted: #8888A0;
        --border: rgba(255, 255, 255, 0.06);
        --terminal-green: #4ADE80;

        /* Agency-specific (injected at generation time) */
        --accent: {{ACCENT_COLOR}};
        --accent-subtle: {{ACCENT_SUBTLE}};
        --font-heading: {{FONT_HEADING}};
        --font-body: {{FONT_BODY}};
        --font-code: {{FONT_CODE}};
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        font-family: var(--font-body);
        background: var(--bg-deep);
        color: var(--text-primary);
        line-height: 1.6;
        position: relative;
        overflow-x: hidden;
    }

    /* Noise overlay */
    body::before {
        content: '';
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        opacity: 0.03;
        z-index: 1;
        pointer-events: none;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    }

    .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 2rem;
        position: relative;
        z-index: 2;
    }

    /* Hero Section */
    .hero {
        min-height: 60vh;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 2rem 0 4rem;
        position: relative;
        background: linear-gradient(to bottom, var(--bg-deep), var(--bg-card));
    }

    .hero::before {
        content: '';
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        opacity: 0.02;
        background-image: radial-gradient(circle, var(--text-primary) 1px, transparent 1px);
        background-size: 40px 40px;
        z-index: 0;
    }

    .hero-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1rem 0;
        position: relative;
        z-index: 1;
    }

    .client-logo img, .agency-logo img {
        max-height: 50px;
        max-width: 200px;
    }

    .client-logo-text, .agency-logo-text {
        font-family: var(--font-heading);
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--text-primary);
    }

    .hero-content {
        position: relative;
        z-index: 1;
        padding: 4rem 0;
    }

    .hero-subtitle {
        font-family: var(--font-code);
        font-size: 0.875rem;
        color: var(--text-muted);
        letter-spacing: 0.05em;
        margin-bottom: 1rem;
    }

    .hero-title {
        font-family: var(--font-heading);
        font-size: clamp(2.5rem, 8vw, 5rem);
        font-weight: 700;
        line-height: 1.1;
        margin-bottom: 1.5rem;
        letter-spacing: -0.03em;
    }

    .hero-tagline {
        font-family: 'Playfair Display', serif;
        font-style: italic;
        font-size: clamp(1.5rem, 4vw, 2.5rem);
        color: var(--accent);
        margin-bottom: 2rem;
    }

    .cursor {
        display: inline-block;
        width: 2px; height: 1em;
        background: var(--accent);
        animation: blink 1s infinite;
        margin-left: 0.25rem;
    }

    @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
    }

    /* Section Styles */
    section {
        padding: 6rem 0;
        position: relative;
        z-index: 2;
    }

    .section-label {
        font-family: var(--font-code);
        font-size: 0.875rem;
        color: var(--accent);
        margin-bottom: 2rem;
        letter-spacing: 0.05em;
    }

    .section-label::before {
        content: '// ';
        color: var(--text-muted);
    }

    h2 {
        font-family: var(--font-heading);
        font-size: clamp(2rem, 5vw, 3rem);
        font-weight: 700;
        margin-bottom: 2rem;
        letter-spacing: -0.02em;
    }

    h3 {
        font-family: var(--font-heading);
        font-size: 1.5rem;
        font-weight: 600;
        margin-bottom: 1rem;
    }

    h4 {
        font-family: var(--font-heading);
        font-size: 1.125rem;
        font-weight: 600;
        margin-bottom: 0.75rem;
        color: var(--text-primary);
    }

    p {
        color: var(--text-muted);
        font-size: 1.125rem;
        margin-bottom: 1.5rem;
    }

    /* Card Styles */
    .card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 1.5rem;
        padding: 2rem;
        position: relative;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
        transform: translateY(-2px);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .card.accent-border {
        border-left: 3px solid var(--accent);
    }

    /* Stats Grid */
    .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 1.5rem;
        margin: 3rem 0;
    }

    .stat-card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 1.5rem;
        padding: 2rem;
    }

    .stat-label {
        font-family: var(--font-code);
        font-size: 0.75rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.1em;
        margin-bottom: 0.5rem;
    }

    .stat-value {
        font-family: var(--font-heading);
        font-size: 2.5rem;
        font-weight: 700;
        color: var(--accent);
    }

    /* Two Column Layout */
    .two-col {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 2rem;
        margin: 3rem 0;
    }

    /* Checklist */
    .checklist {
        list-style: none;
    }

    .checklist li {
        color: var(--text-muted);
        font-size: 1rem;
        margin-bottom: 1rem;
        padding-left: 2rem;
        position: relative;
    }

    .checklist li::before {
        content: '>';
        position: absolute;
        left: 0;
        color: var(--accent);
        font-family: var(--font-code);
    }

    /* Data Tables (for research/audit deliverables) */
    .data-table {
        width: 100%;
        border-collapse: collapse;
        margin: 2rem 0;
        font-size: 0.95rem;
    }

    .data-table th {
        background: var(--bg-elevated);
        color: var(--accent);
        font-family: var(--font-code);
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        padding: 1rem;
        text-align: left;
        border-bottom: 2px solid var(--border);
    }

    .data-table td {
        padding: 1rem;
        border-bottom: 1px solid var(--border);
        color: var(--text-muted);
        vertical-align: top;
    }

    .data-table tr:hover td {
        background: rgba(255, 255, 255, 0.02);
    }

    .data-table td:first-child {
        color: var(--text-primary);
        font-weight: 500;
    }

    /* Blockquotes / User Quotes */
    .user-quote {
        border-left: 3px solid var(--accent);
        padding: 1rem 1.5rem;
        margin: 1.5rem 0;
        background: var(--bg-card);
        border-radius: 0 0.75rem 0.75rem 0;
    }

    .user-quote p {
        font-style: italic;
        color: var(--text-primary);
        margin-bottom: 0.5rem;
        font-size: 1rem;
    }

    .user-quote .quote-source {
        font-family: var(--font-code);
        font-size: 0.75rem;
        color: var(--text-muted);
    }

    /* Roadmap Timeline (vertical) */
    .quarter-header {
        font-family: var(--font-code);
        font-size: 1rem;
        color: var(--accent);
        text-transform: uppercase;
        letter-spacing: 0.1em;
        margin-top: 4rem;
        margin-bottom: 2rem;
        padding-bottom: 1rem;
        border-bottom: 2px solid var(--accent);
    }

    .quarter-header:first-of-type {
        margin-top: 0;
    }

    .month-card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 1.5rem;
        padding: 2rem;
        margin-bottom: 1.5rem;
        position: relative;
        padding-left: 3rem;
    }

    .month-card::before {
        content: '';
        position: absolute;
        left: 1.25rem;
        top: 0;
        bottom: 0;
        width: 2px;
        background: var(--border);
    }

    .month-card::after {
        content: '';
        position: absolute;
        left: calc(1.25rem - 4px);
        top: 2.25rem;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--accent);
        border: 2px solid var(--bg-deep);
    }

    .month-number {
        font-family: var(--font-code);
        font-size: 0.875rem;
        color: var(--accent);
        margin-bottom: 0.5rem;
    }

    .month-title {
        font-size: 1.25rem;
        font-weight: 600;
        margin-bottom: 0.75rem;
        color: var(--text-primary);
    }

    .month-focus {
        color: var(--text-muted);
        font-size: 1rem;
        margin-bottom: 1rem;
    }

    .month-activities {
        list-style: none;
    }

    .month-activities li {
        color: var(--text-muted);
        font-size: 0.95rem;
        margin-bottom: 0.5rem;
        padding-left: 1.5rem;
        position: relative;
    }

    .month-activities li::before {
        content: '>';
        position: absolute;
        left: 0;
        color: var(--accent);
        font-family: var(--font-code);
    }

    .kpi-tag {
        display: inline-block;
        font-family: var(--font-code);
        font-size: 0.75rem;
        color: var(--terminal-green);
        background: rgba(74, 222, 128, 0.1);
        padding: 0.25rem 0.75rem;
        border-radius: 1rem;
        margin-top: 0.75rem;
        margin-right: 0.5rem;
    }

    /* Status badges (for hub page) */
    .status-badge {
        display: inline-block;
        font-family: var(--font-code);
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        padding: 0.25rem 0.75rem;
        border-radius: 1rem;
        margin-bottom: 1rem;
    }

    .status-badge.complete {
        background: rgba(74, 222, 128, 0.15);
        color: var(--terminal-green);
    }

    .status-badge.pending {
        background: rgba(245, 158, 11, 0.15);
        color: #F59E0B;
    }

    /* Hub link cards */
    .hub-card {
        text-decoration: none;
        color: inherit;
        display: block;
    }

    .hub-card h3 {
        color: var(--text-primary);
        transition: color 0.3s ease;
    }

    .hub-card:hover h3 {
        color: var(--accent);
    }

    .hub-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        border-color: var(--accent);
    }

    /* CTA Button */
    .cta-button {
        display: inline-block;
        background: var(--accent);
        color: var(--bg-deep);
        font-family: var(--font-heading);
        font-size: 1.125rem;
        font-weight: 600;
        padding: 1rem 2.5rem;
        border-radius: 0.75rem;
        text-decoration: none;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .cta-button:hover {
        transform: scale(1.03);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    /* Bullet list (generic) */
    .content-list {
        list-style: none;
        margin: 1rem 0;
    }

    .content-list li {
        color: var(--text-muted);
        font-size: 1rem;
        margin-bottom: 0.75rem;
        padding-left: 1.5rem;
        position: relative;
    }

    .content-list li::before {
        content: '>';
        position: absolute;
        left: 0;
        color: var(--accent);
        font-family: var(--font-code);
    }

    /* Angle / insight cards */
    .angle-card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-left: 3px solid var(--accent);
        border-radius: 0 1rem 1rem 0;
        padding: 1.5rem 2rem;
        margin-bottom: 1.5rem;
    }

    .angle-card .angle-name {
        font-family: var(--font-heading);
        font-size: 1.125rem;
        font-weight: 600;
        color: var(--text-primary);
        margin-bottom: 0.5rem;
    }

    .angle-card .angle-source {
        font-family: var(--font-code);
        font-size: 0.75rem;
        color: var(--text-muted);
        margin-bottom: 0.5rem;
    }

    /* Pillar cards (for roadmap strategic pillars) */
    .pillars-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1.5rem;
        margin: 3rem 0;
    }

    .pillar-card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-top: 3px solid var(--accent);
        border-radius: 0 0 1.5rem 1.5rem;
        padding: 2rem;
    }

    .pillar-number {
        font-family: var(--font-code);
        font-size: 0.75rem;
        color: var(--accent);
        margin-bottom: 0.75rem;
    }

    .pillar-card h3 {
        font-size: 1.25rem;
        margin-bottom: 0.75rem;
    }

    /* Milestones */
    .milestone-row {
        display: flex;
        align-items: center;
        gap: 1.5rem;
        padding: 1.25rem 0;
        border-bottom: 1px solid var(--border);
    }

    .milestone-row:last-child {
        border-bottom: none;
    }

    .milestone-month {
        font-family: var(--font-code);
        font-size: 0.875rem;
        color: var(--accent);
        min-width: 80px;
        font-weight: 600;
    }

    .milestone-dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--accent);
        flex-shrink: 0;
    }

    .milestone-text {
        color: var(--text-primary);
        font-size: 1rem;
    }

    .milestone-metric {
        font-family: var(--font-code);
        font-size: 0.875rem;
        color: var(--text-muted);
        margin-left: auto;
    }

    /* Footer */
    footer {
        background: var(--bg-card);
        padding: 3rem 0;
        margin-top: 6rem;
        border-top: 1px solid var(--border);
    }

    .footer-content {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 2rem;
    }

    .status-indicator {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-family: var(--font-code);
        font-size: 0.875rem;
        color: var(--text-muted);
    }

    .status-dot {
        width: 8px;
        height: 8px;
        background: var(--terminal-green);
        border-radius: 50%;
        animation: pulse 2s infinite;
    }

    @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
    }

    /* Fade in animation */
    .fade-in {
        opacity: 0;
        transform: translateY(20px);
        animation: fadeInUp 0.6s ease forwards;
    }

    @keyframes fadeInUp {
        to { opacity: 1; transform: translateY(0); }
    }

    /* Responsive */
    @media (max-width: 768px) {
        .container { padding: 0 1.5rem; }
        section { padding: 4rem 0; }
        .hero { min-height: auto; padding: 2rem 0 3rem; }
        .hero-header { flex-direction: column; align-items: flex-start; gap: 1rem; }
        .two-col { grid-template-columns: 1fr; }
        .pillars-grid { grid-template-columns: 1fr; }
        .footer-content { flex-direction: column; align-items: flex-start; }
        .data-table { font-size: 0.85rem; }
        .data-table th, .data-table td { padding: 0.75rem; }
        .milestone-metric { display: none; }
    }
</style>
